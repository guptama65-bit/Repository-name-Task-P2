<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DEV@Deakin - Subscribe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        nav {
            background: #222;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
        }

        .container {
            max-width: 600px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
        }

        input {
            width: 70%;
            padding: 12px;
            margin: 10px;
        }

        button {
            padding: 12px 25px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">About</a>
        <a href="#">Articles</a>
        <a href="#">Tutorials</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">

        <h1>DEV@Deakin</h1>

        <h2>Subscribe to our Newsletter</h2>

        <p>
            Enter your email address to receive the latest
            DEV@Deakin updates.
        </p>

        <form id="subscribeForm">

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <button type="submit">
                Subscribe
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script>
        const form = document.getElementById("subscribeForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;

            try {

                const response = await fetch("/subscribe", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email
                    })
                });

                const data = await response.json();

                message.textContent = data.message;

                if (response.ok) {
                    form.reset();
                }

            } catch (error) {

                console.error(error);

                message.textContent =
                    "Something went wrong. Please try again.";
            }
        });
    </script>

</body>

</html>
